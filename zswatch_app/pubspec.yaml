name: zswatch_app
description: "ZSWatch Companion App - BLE communication, firmware updates, health data, and developer tools for ZSWatch smartwatch."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.10+1

  # BLE Communication
  flutter_blue_plus: ^1.35.2

  # Firmware Updates (MCUmgr/SMP)
  # Using local clone for development - will switch back to published version after PR is merged
  mcumgr_flutter:
    path: ../Flutter-nRF-Connect-Device-Manager

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Database (SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Storage & File System
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  path_provider: ^2.1.5
  path: ^1.9.1

  # HTTP / Networking
  http: ^1.2.2
  archive: ^4.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^14.6.2

  # Utilities
  collection: ^1.19.1
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  rxdart: ^0.28.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3

  # Testing
  mockito: ^5.4.5
  build_resolvers: ^2.4.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
