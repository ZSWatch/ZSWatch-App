name: zswatch_app
description: "Connect your Open Source ZSWatch smartwatch to set it up, update firmware, track health data and more."
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.10+1

  # BLE Communication
  flutter_blue_plus: ^2.0.2

  # Firmware Updates (MCUmgr/SMP)
  # Fork: https://github.com/ZSWatch/Flutter-nRF-Connect-Device-Manager
  # Included as a git submodule in ../Flutter-nRF-Connect-Device-Manager
  mcumgr_flutter:
    path: ../Flutter-nRF-Connect-Device-Manager

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Database (SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Storage & File System
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  path_provider: ^2.1.5
  path: ^1.9.1

  # HTTP / Networking
  http: ^1.2.2
  archive: ^4.0.0
  xml: ^6.5.0

  # Permissions
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^14.6.2

  # Utilities
  collection: ^1.19.1
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  rxdart: ^0.28.0
  ffi: ^2.1.3
  chrono_dart: ^2.0.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.6
  wakelock_plus: ^1.2.8

  # Audio Playback (voice memo Ogg/Opus)
  just_audio: ^0.9.42

  # Speech-to-Text (offline Whisper inference)
  whisper_ggml_plus: ^1.3.5
  whisper_ggml_plus_ffmpeg: ^1.0.0
  ffmpeg_kit_flutter_new_min: ^3.1.0

  # Location (for GPS requests from watch)
  geolocator: ^13.0.2

  # Local LLM inference (llama.cpp via fllama)
  # Git submodule (ZSWatch/fllama fork) with iOS ggml header-map fixes.
  fllama:
    path: ../third_party/fllama
  chrono_ai_flow:
    path: ../packages/chrono_ai_flow

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3

  # Testing
  mockito: ^5.4.5
  build_resolvers: ^2.4.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/models/
