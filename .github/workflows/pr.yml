name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch submodules
        run: git -c credential.helper= -c core.askPass= -c credential.interactive=never submodule update --init --force --depth=1 --recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.1"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('zswatch_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get dependencies
        working-directory: zswatch_app
        run: flutter pub get

      - name: Run code generation
        working-directory: zswatch_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        working-directory: zswatch_app
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: zswatch_app
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch submodules
        run: git -c credential.helper= -c core.askPass= -c credential.interactive=never submodule update --init --force --depth=1 --recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.1"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('zswatch_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get dependencies
        working-directory: zswatch_app
        run: flutter pub get

      - name: Run code generation
        working-directory: zswatch_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        working-directory: zswatch_app
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch submodules
        run: git -c credential.helper= -c core.askPass= -c credential.interactive=never submodule update --init --force --depth=1 --recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.1"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('zswatch_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('zswatch_app/android/**/*.gradle*', 'zswatch_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get dependencies
        working-directory: zswatch_app
        run: flutter pub get

      - name: Run code generation
        working-directory: zswatch_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        working-directory: zswatch_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: zswatch_app/build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch submodules
        run: git -c credential.helper= -c core.askPass= -c credential.interactive=never submodule update --init --force --depth=1 --recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.1"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('zswatch_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            zswatch_app/ios/Pods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('zswatch_app/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Get dependencies
        working-directory: zswatch_app
        run: flutter pub get

      - name: Run code generation
        working-directory: zswatch_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        working-directory: zswatch_app
        run: flutter build ios --no-codesign
